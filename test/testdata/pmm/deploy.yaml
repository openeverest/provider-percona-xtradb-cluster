apiVersion: v1
kind: Namespace
metadata:
  name: pmm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pmm-server
  namespace: pmm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pmm-server
  template:
    metadata:
      labels:
        app: pmm-server
    spec:
      containers:
        - name: pmm-server
          # pmm-server is published for linux/amd64 only (no arm64 build).
          # Pinning to the amd64 manifest digest bypasses the runtime's
          # platform matching so it runs natively on amd64 (CI) and under
          # emulation on arm64 (e.g. Apple Silicon via Docker Desktop QEMU).
          image: percona/pmm-server:3.9.0@sha256:860ea9ccf3381b8a0a19316704e0de7f15c1906c9ffe5faaaafffe90f63d6c64
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pmm-server
  namespace: pmm
spec:
  type: ClusterIP
  selector:
    app: pmm-server
  ports:
    - protocol: TCP
      port: 443
      targetPort: 8443
