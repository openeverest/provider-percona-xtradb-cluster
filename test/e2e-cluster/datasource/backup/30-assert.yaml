apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: pxc-src
spec:
  providerRef:
    name: percona-xtradb-cluster
  backup:
    enabled: true
    classRef:
      name: pxc
    storages:
      - storageRef:
          name: minio-storage
        schedules:
          - name: full
            enabled: true
            cron: "0 2 * * *"
  topology:
    type: cluster
  components:
    engine:
      type: pxc
      replicas: 1
      storage:
        size: 1Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
        requests:
          cpu: 600m
          memory: 512Mi
    proxy:
      type: haproxy
      replicas: 1
---
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: pxc-src

