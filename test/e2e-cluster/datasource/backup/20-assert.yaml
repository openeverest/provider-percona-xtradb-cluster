apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-storage
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: pxc
spec:
  displayName: Percona Backup for MySQL based on Percona XtraDB Cluster
  executionMode: ProviderManaged
  backupStorageClasses:
    - name: s3
      authModes:
        - AccessKey
  providerManaged:
    providerRef:
      name: percona-xtradb-cluster
    supportsPITR: true
    limits:
      maxPITREnabledStorages: 1

