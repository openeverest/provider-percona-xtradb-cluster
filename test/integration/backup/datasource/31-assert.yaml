apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: src-pxc-cluster
status:
  phase: Provisioned
  (conditions[?type == 'Ready'].status | [0]): "True"
  (conditions[?type == 'Restoring'].status | [0]): "False"
  (conditions[?type == 'Restoring'].reason | [0]): Succeeded
---
apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: src-restore
status:
  state: Succeeded
---
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterRestore
metadata:
  name: src-restore
status:
  state: Succeeded

