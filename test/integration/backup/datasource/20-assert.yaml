apiVersion: backup.openeverest.io/v1alpha1
kind: Backup
metadata:
  name: src-backup
spec:
  origin:
    type: Instance
    instanceRef:
      name: src-pxc-cluster
  classRef:
    name: pxc
  storageRef:
    name: test-storage-s3
---
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterBackup
metadata:
  name: src-backup
spec:
  pxcCluster: src-pxc-cluster
  storageName: test-storage-s3
