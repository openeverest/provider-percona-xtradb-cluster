apiVersion: v1
kind: Secret
metadata:
  name: backup-storage-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: dGVzdC1hY2Nlc3Mta2V5
  AWS_SECRET_ACCESS_KEY: dGVzdC1zZWNyZXQta2V5
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: test-storage-s3
spec:
  backupStorageClassRef:
    name: s3
  location:
    bucket: test-backup-bucket
  parameters:
    region: us-east-1
    endpointURL: http://fake
    forcePathStyle: true
    implementation: other
  authentication:
    mode: AccessKey
    credentialsSecretRef:
      name: backup-storage-credentials

