apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pxc-cluster
spec:
  providerRef:
    name: percona-xtradb-cluster
  components:
    engine:
      type: pxc
      replicas: 3
    proxy:
      type: haproxy
      replicas: 1
status:
  phase: Ready
  # The PXC operator is scaled to 0, so the components have no pods.
  components:
    - name: engine
      selector: core.openeverest.io/component=engine,core.openeverest.io/instance=test-pxc-cluster
      replicas: 0
      readyReplicas: 0
    - name: proxy
      selector: core.openeverest.io/component=proxy,core.openeverest.io/instance=test-pxc-cluster
      replicas: 0
      readyReplicas: 0
---
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: test-pxc-cluster
status:
  state: ready
  pxc:
    size: 3
    ready: 3
---
apiVersion: v1
kind: Secret
metadata:
  name: test-pxc-cluster-conn

