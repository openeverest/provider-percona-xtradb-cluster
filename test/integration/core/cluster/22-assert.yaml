apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pxc-cluster
spec:
  providerRef:
    name: percona-xtradb-cluster
  components:
    engine:
      type: pxc
      replicas: 5
      service:
        serviceType: LoadBalancer
        annotations:
          test-annotation: "test-value"
        loadBalancerService:
          sourceRanges:
            - "10.0.0.0/8"
            - "192.168.1.100"
    proxy:
      type: haproxy
      replicas: 1
status:
  phase: Ready
---
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: test-pxc-cluster
spec:
  pxc:
    size: 5
status:
  state: ready
  pxc:
    size: 5
    ready: 5

