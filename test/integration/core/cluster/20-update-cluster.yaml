apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pxc-cluster
spec:
  providerRef:
    name: percona-xtradb-cluster
  components:
    engine:
      type: pxc
      replicas: 5
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
    proxy:
      type: haproxy
      replicas: 1

