apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pxc-nosecret
spec:
  providerRef:
    name: percona-xtradb-cluster
  userSecretRef:
    name: test-admission-missing-users
  components:
    engine:
      type: pxc
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
    proxy:
      type: haproxy
      replicas: 1
