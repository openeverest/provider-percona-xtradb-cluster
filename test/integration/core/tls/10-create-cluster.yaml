apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pxc-tls
spec:
  providerRef:
    name: percona-xtradb-cluster
  components:
    engine:
      type: pxc
      replicas: 3
      storage:
        size: 25Gi
    proxy:
      type: haproxy
      replicas: 1
  parameters:
    tls:
      certificateSecretName: test-pxc-tls-certs

