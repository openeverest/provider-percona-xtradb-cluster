apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pxc-tls-bothset
spec:
  providerRef:
    name: percona-xtradb-cluster
  components:
    engine:
      type: pxc
      replicas: 3
      storage:
        size: 25Gi
    proxy:
      type: haproxy
      replicas: 1
  parameters:
    tls:
      # Setting a certificate secret and a cert-manager issuer together must
      # be rejected (validateTLSParameters in internal/provider/tls.go). The
      # secret itself is valid and already exists (created in
      # 10-create-secret.yaml) so this exercises the "both set" rule
      # specifically.
      certificateSecretName: test-pxc-tls-certs
      issuer:
        name: some-issuer
        kind: Issuer

