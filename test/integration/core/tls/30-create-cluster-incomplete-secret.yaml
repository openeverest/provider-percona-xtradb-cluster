---
# Missing ca.crt: validateCertificateSecret in internal/provider/tls.go must
# reject this before Sync ever creates a PerconaXtraDBCluster CR.
apiVersion: v1
kind: Secret
metadata:
  name: test-pxc-tls-incomplete-certs
stringData:
  tls.crt: fake-tls-crt
  tls.key: fake-tls-key
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pxc-tls-badsecret
spec:
  providerRef:
    name: percona-xtradb-cluster
  components:
    engine:
      type: pxc
      replicas: 3
      storage:
        size: 25Gi
    proxy:
      type: haproxy
      replicas: 1
  parameters:
    tls:
      certificateSecretName: test-pxc-tls-incomplete-certs

