---
# A user-supplied certificate secret. Its content is not a real certificate:
# the operator is scaled to 0 in this suite, so nothing ever parses it as
# X.509 — the provider only checks that the required keys are non-empty
# (see internal/provider/tls.go's validateCertificateSecret).
apiVersion: v1
kind: Secret
metadata:
  name: test-pxc-tls-certs
stringData:
  tls.crt: fake-tls-crt
  tls.key: fake-tls-key
  ca.crt: fake-ca-crt

