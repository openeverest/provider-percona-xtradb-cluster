apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: pxc-metrics-policy
spec:
  providerRef:
    name: percona-xtradb-cluster
  components:
    engine:
      type: pxc
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 1G
      storage:
        size: 10Gi
    proxy:
      type: haproxy
      replicas: 1
  monitoring:
    sources:
      metrics:
        policy: OnDemand
