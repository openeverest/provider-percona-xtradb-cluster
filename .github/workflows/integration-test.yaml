---
# Reusable workflow — run chainsaw integration tests inside a k3d cluster.
name: Integration test

on:
  workflow_call:
    inputs:
      make_target:
        description: Make target to execute for the integration suite(s)
        required: true
        type: string
      suite:
        description: Human-readable suite name for the job label
        required: false
        default: integration
        type: string
      timeout_minutes:
        description: Job timeout in minutes
        required: false
        default: 60
        type: number

permissions:
  contents: read

env:
  IMG: provider-percona-xtradb-cluster:ci
  OPENEVEREST_DIR: _openeverest
  OPENEVEREST_BRANCH: main

jobs:
  run:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout OpenEverest (v2)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: openeverest/openeverest
          ref: ${{ env.OPENEVEREST_BRANCH }}
          path: ${{ env.OPENEVEREST_DIR }}

      - name: Install Kubernetes tooling
        uses: ./.github/actions/setup-k8s-tools
        with:
          install-k3d: 'true'
          install-chainsaw: 'true'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Create k3d cluster
        run: |
          sudo modprobe br_netfilter
          make k3d-cluster-up

      - name: Build provider image
        run: make docker-build

      - name: Import provider image into k3d
        run: make load-image

      - name: Build OpenEverest controller image
        working-directory: ${{ env.OPENEVEREST_DIR }}
        run: make docker-build-controller

      - name: Import OpenEverest controller image into k3d
        run: make load-openeverest-controller-image

      - name: Install CRDs
        run: make install-crds

      - name: Deploy provider for CI
        run: make deploy-provider-ci PXC_OPERATOR_REPLICA_COUNT=0

      - name: Deploy OpenEverest controller
        working-directory: ${{ env.OPENEVEREST_DIR }}
        run: make deploy-test-controller

      - name: Run integration suite(s)
        run: make ${{ inputs.make_target }}

      - name: Upload chainsaw report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chainsaw-${{ inputs.suite }}-${{ github.run_id }}
          path: /tmp/chainsaw-report*.xml
          retention-days: 7

      - name: Cleanup test cluster
        if: always()
        run: make k3d-cluster-down
