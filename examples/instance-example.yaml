apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  finalizers:
    - everest.percona.com/provider-finalizer
  name: inst-vyg
  namespace: default
spec:
  # Component instances — versions are resolved from the .spec.version bundle.
  components:
    # Main database engine (required)
    engine:
      replicas: 3
      resources:
        limits:
          cpu: "4"
          memory: 8Gi
      storage:
        size: 100Gi
        storageClass: local-path
    # Proxy/router (required)
    proxy:
      replicas: 2
      type: haproxy
      # Optional: expose the proxy Service externally, e.g. to obtain a
      # public IP via a cloud load balancer. Omit for the default
      # ClusterIP (internal-only) behavior.
      parameters:
        expose:
          type: LoadBalancer
          # Restrict which clients can reach the load balancer. Requires
          # type: LoadBalancer -- any other type is rejected rather than
          # ignored. Without this the proxy is open to the whole internet.
          #
          # There is no Everest UI control for this list (the UI generator
          # cannot bind array fields), so set it by applying the Instance.
          loadBalancerSourceRanges:
            - 203.0.113.0/24
  deletionPolicy: Cascade

  # Provider identifier
  providerRef:
    name: percona-xtradb-cluster

  # Topology configuration
  topology:
    type: cluster

  # High-level version bundle — selects a curated, pre-validated set of
  # component versions. Omit this field to use the provider's default bundle.
  # Individual component version overrides still take precedence.
  version: 8.4.8


